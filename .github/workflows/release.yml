name: Build & Release Cube Collector

on:
  push:
    tags:
      - 'v*'

jobs:
  Build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          # Changed to include the subfolder so the cache tracks game3d files
          key: ${{ matrix.os }}-game3d

      - name: Build Cube Collector
        # Added --manifest-path so Cargo builds from your subfolder
        run: cargo build --release --manifest-path game3d/Cargo.toml

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        shell: bash

      - name: Create zip files
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            mkdir -p cube-collector-windows
            find game3d/target/release -maxdepth 1 -type f -name "*.exe" -exec cp {} cube-collector-windows/cube_collector.exe \;
            powershell -Command "Compress-Archive -Path cube-collector-windows -DestinationPath cube-collector-windows-${VERSION}.zip"
            
          elif [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            mkdir -p cube-collector-linux
            find game3d/target/release -maxdepth 1 -type f ! -name "*.*" ! -name "lib*" -exec cp {} cube-collector-linux/cube_collector \;
            zip -r cube-collector-linux-${VERSION}.zip cube-collector-linux
            
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            mkdir -p cube-collector-macos
            # BSD-compatible find that works perfectly on macOS
            find game3d/target/release -maxdepth 1 -type f ! -name "*.*" ! -name "lib*" -exec cp {} cube-collector-macos/cube_collector \;
            zip -r cube-collector-macos-${VERSION}.zip cube-collector-macos
          fi
        shell: bash




      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cube-collector-${{ matrix.os }}
          path: cube-collector-*-${{ steps.version.outputs.VERSION }}.zip

  release:
    needs: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: release-files

      - name: Publish to Tyxar-BLADE-Releases
        uses: softprops/action-gh-release@v2
        with:
          repository: tyxar-lang/Tyxar-BLADE-Releases
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: Cube Collector ${{ github.ref_name }}
          files: release-files/*.zip
          fail_on_unmatched_files: true
